 
name: CI - Huellas Dulces Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Unit tests, coverage and build
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configurar Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias con cobertura
        run: npx ng test --watch=false --coverage

      - name: Verificar cobertura minima del 80 por ciento
        run: |
          python3 - <<'PY'
          import sys

          path = "coverage/huellas-dulces-web/lcov.info"
          totals = {
              "LINEAS": [0, 0],
              "FUNCIONES": [0, 0],
              "RAMAS": [0, 0],
          }

          try:
              with open(path, encoding="utf-8") as report:
                  for line in report:
                      line = line.strip()

                      if line.startswith("LF:"):
                          totals["LINEAS"][0] += int(line[3:])
                      elif line.startswith("LH:"):
                          totals["LINEAS"][1] += int(line[3:])
                      elif line.startswith("FNF:"):
                          totals["FUNCIONES"][0] += int(line[4:])
                      elif line.startswith("FNH:"):
                          totals["FUNCIONES"][1] += int(line[4:])
                      elif line.startswith("BRF:"):
                          totals["RAMAS"][0] += int(line[4:])
                      elif line.startswith("BRH:"):
                          totals["RAMAS"][1] += int(line[4:])
          except Exception as error:
              print(f"ERROR al leer cobertura LCOV: {error}")
              sys.exit(1)

          failed = False

          for name, (total, covered) in totals.items():
              percentage = covered / total * 100 if total else 0
              print(f"{name}: {percentage:.2f}% (minimo: 80%)")

              if total == 0 or percentage < 80:
                  failed = True

          if failed:
              print("ERROR: La cobertura no cumple el minimo del 80%.")
              sys.exit(1)

          print("Cobertura aprobada.")
          PY

      - name: Compilar Angular para produccion
        run: npm run build

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-coverage-report
          path: coverage/huellas-dulces-web/
          if-no-files-found: warn

  e2e:
    name: Cypress E2E
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Descargar codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configurar Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Iniciar Angular y comprobar disponibilidad
        run: |
          npm start -- --host 0.0.0.0 --port 4200 > angular-start.log 2>&1 &
          echo $! > angular.pid

          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4200/ > /dev/null; then
              echo "Angular esta disponible."
              exit 0
            fi

            if ! kill -0 "$(cat angular.pid)" 2>/dev/null; then
              echo "ERROR: Angular se cerro durante el arranque."
              cat angular-start.log
              exit 1
            fi

            sleep 2
          done

          echo "ERROR: Angular no respondio en 120 segundos."
          cat angular-start.log
          exit 1

      - name: Ejecutar pruebas E2E con Cypress
        uses: cypress-io/github-action@f790eee7a50d9505912f50c2095510be7de06aa7
        with:
          install: false
          command: npx cypress run --browser electron

      - name: Mostrar registros de Angular
        if: always()
        run: |
          if [ -f angular-start.log ]; then
            cat angular-start.log
          fi

      - name: Guardar videos y capturas de Cypress
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-cypress-results
          path: |
            cypress/videos/
            cypress/screenshots/
          if-no-files-found: ignore

  docker-publish:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: [build-test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Descargar codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: true
          tags: |
            salomon09/huellas-dulces-frontend:v1.0.0
            salomon09/huellas-dulces-frontend:latest
